name: Daily finance knowledge

on:
  schedule:
    - cron: "23 11 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      channel:
        description: "频道配置 ID；留空表示全部启用频道"
        required: false
        type: string
      video:
        description: "单个 YouTube 视频 URL；使用时必须指定频道"
        required: false
        type: string
      backfill_days:
        description: "覆盖默认回溯天数；留空使用频道配置"
        required: false
        type: string
      preview:
        description: "只生成预览 Artifact，不提交、不通知"
        required: false
        default: false
        type: boolean
      force:
        description: "即使字幕未变化也重新调用 AI"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: youtube-finance-kb
  cancel-in-progress: false

jobs:
  build-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POE_API_KEY: ${{ secrets.POE_API_KEY }}
      POE_MODEL: ${{ vars.POE_MODEL || 'GPT-5.4' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      YOUTUBE_PROXY_URL: ${{ secrets.YOUTUBE_PROXY_URL }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_TO: ${{ vars.EMAIL_TO }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install .

      - name: Verify YouTube proxy
        run: |
          if [[ -z "$YOUTUBE_PROXY_URL" ]]; then
            echo "::error::YOUTUBE_PROXY_URL is required on GitHub-hosted runners. Configure a rotating residential proxy URL in Actions Secrets."
            exit 1
          fi

      - name: Process captions
        id: process
        continue-on-error: true
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VIDEO: ${{ inputs.video }}
          INPUT_BACKFILL_DAYS: ${{ inputs.backfill_days }}
          INPUT_PREVIEW: ${{ inputs.preview }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=(process --fail-on-errors)
          if [[ -n "$INPUT_CHANNEL" ]]; then args+=(--channel "$INPUT_CHANNEL"); fi
          if [[ -n "$INPUT_VIDEO" ]]; then args+=(--video "$INPUT_VIDEO"); fi
          if [[ -n "$INPUT_BACKFILL_DAYS" ]]; then args+=(--backfill-days "$INPUT_BACKFILL_DAYS"); fi
          if [[ "$INPUT_PREVIEW" == "true" ]]; then args+=(--preview); fi
          if [[ "$INPUT_FORCE" == "true" ]]; then args+=(--force); fi
          python -m yt_finance_kb "${args[@]}"

      - name: Upload preview
        if: ${{ inputs.preview == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finance-knowledge-preview
          path: preview-output/
          if-no-files-found: error

      - name: Commit knowledge
        if: ${{ inputs.preview != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge indexes state/videos.json
          if git diff --cached --quiet; then
            echo "No new knowledge to commit"
          else
            git commit -m "knowledge: update YouTube finance notes"
            git push
          fi

      - name: Send pending notifications
        if: ${{ inputs.preview != true }}
        run: python -m yt_finance_kb notify --repository-url "$REPOSITORY_URL"

      - name: Commit delivery state
        if: ${{ inputs.preview != true }}
        run: |
          git add state/videos.json
          if git diff --cached --quiet; then
            echo "No delivery state to commit"
          else
            git commit -m "state: record knowledge deliveries"
            git push
          fi

      - name: Report processing failure
        if: ${{ steps.process.outcome == 'failure' }}
        run: |
          echo "::error::One or more videos could not be processed. See Process captions and state/videos.json."
          exit 1
